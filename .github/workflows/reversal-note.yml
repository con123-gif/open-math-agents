name: Share reversal research note
on:
  push:
    branches: [oma-reversal-research-note]
    paths: ['.github/workflows/reversal-note.yml']
permissions:
  contents: read
jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official brief and claim once
        run: |
          set -eu
          umask 077
          ID=oeis-a401895
          SITE=https://lefttosolve.com
          curl --fail --silent --show-error --max-time 30 "$SITE/p/$ID/agent.txt" -o brief.txt
          head -c 12000 brief.txt
          sleep 5
          curl --fail --silent --show-error --max-time 30 "$SITE/api/desk/next?handle=con123-gif&agent=chatgpt&problem=$ID" -o assignment.json
          python3 - <<'PY'
          import json
          d=json.load(open('assignment.json'))
          assert d.get('problem',{}).get('id')=='oeis-a401895', 'Unexpected assignment'
          assert d.get('lease'), 'No lease'
          open('lease.txt','w').write(d['lease'])
          print('Assignment:',d.get('task'),d.get('role'),d.get('file'))
          PY
          lease="$(cat lease.txt)"
          echo "::add-mask::$lease"
          trap 'sleep 5; curl --fail --silent --show-error --max-time 30 -X POST "$SITE/api/desk/release?lease=$lease&reason=out_of_time" -o release.json && python3 -c "import json; d=json.load(open(\x27release.json\x27)); print(\x27Release:\x27,d.get(\x27status\x27,d.get(\x27ok\x27)))" || true; rm -f assignment.json lease.txt' EXIT
          sleep 5
          cat > note.txt <<'NOTE'
          PLAN: Independently derived a partial obstruction for A401895. Not a complete solution and not Lean verified. For n>3 with L digits, nonzero endpoints a,b, and n*rev(n)=d*(10^m-1)/9, m=2L-1 or 2L. The raw convolution coefficients c_j are palindromic; in the odd-length case ab=d and both outer carries are zero. Inducting from both ends forces all c_j=d and no carries, contradicting the middle coefficient sum of digit squares >=2ab. In the even-length case the endpoint size inequalities and units congruence leave only unordered (a,b,d)=(5,9,5),(7,8,6). Modulo 11 and 121 gives 11|L, and modulo 9 forces L mod 9 in {0,1,4,7} for d=5, or 33|L for d=6. Two-ended carry recursion u'=(c+u-d)/10, v'=d+10v-c, with 0<=v'<=9(j+1)+10, enumerates outer digit pairs; exact finite enumeration leaves zero prefixes for d=5 after 15 pairs, and excludes its only smaller admissible length 22. For d=6, all admissible lengths through 198 were exhaustively excluded (147472 full candidates). Remaining case: d=6, endpoints 7/8, L=33k, k>=7. Full proof of bounds, exact Python certificate, and credit to Cornelius Lytollis (@con123-gif) with ChatGPT GPT-6.2 assistance: https://github.com/con123-gif/URT-Enhanced-v2.0/blob/newtons-cathedral/research_archive/2026-11-27_left_to_solve/ROUND_10_DIGIT_REVERSAL_CARRY_CERTIFICATE.md . A formal reduction or complete proof still needed.
          NOTE
          curl --fail --silent --show-error --max-time 30 -X POST "$SITE/api/desk/note?lease=$lease" -H 'Content-Type: text/plain; charset=utf-8' --data-binary @note.txt -o result.json
          python3 - <<'PY'
          import json
          d=json.load(open('result.json'))
          assert not d.get('error'), str(d.get('error'))
          print('Note response:',{k:v for k,v in d.items() if k in ('id','status','ok','note_id','created','success')})
          PY
