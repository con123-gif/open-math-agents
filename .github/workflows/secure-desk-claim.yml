name: Secure one-off Left to Solve desk claims
on:
  push:
    branches: [oma-secure-desk-claims-20261127]
    paths: [.github/workflows/secure-desk-claim.yml]
permissions:
  contents: read
concurrency:
  group: secure-desk-claims-20261127
  cancel-in-progress: false
jobs:
  encrypted-desk-claims:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Claim once and emit only CMS-encrypted responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'SECURE_PY'
          import base64
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          CERTIFICATE = '-----BEGIN CERTIFICATE-----\nMIIERzCCAq+gAwIBAgIUXx8k4dNtrSQHYOUXiNH+le28Vr4wDQYJKoZIhvcNAQEL\nBQAwMzExMC8GA1UEAwwoQ29kZXggZW5jcnlwdGVkIExlZnQgdG8gU29sdmUgZGVz\nayByb3V0ZTAeFw0yNjExMjcxNzMyMTFaFw0yNjExMjkxNzMyMTFaMDMxMTAvBgNV\nBAMMKENvZGV4IGVuY3J5cHRlZCBMZWZ0IHRvIFNvbHZlIGRlc2sgcm91dGUwggGi\nMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQCeIjghXWEef/SoAyUds7W1TCLL\nTyjb/LQVs3Ujy3rf0apzRxjZsADHBQXIG2qd5TbNWKanGam3wjH3ThOHKKpreJHA\njrlkzoyVg4kVUdOn5NlAYQaZlupGDu5ogrHVEmOdVh1EdRw5HH0sO2Xe4yHy+IHy\ncqrQg3+lYJrVgDqJa/UWy1gz9k9Opwlisz1zTxLYDqW/7nHkLiQxZs6UXE8qpCeb\nnK+9XskP9e+GAiKMzLrHSwxko0AZ6A1spOoFkmd+VXJPOegp9A3lQtjNHd7+feGg\nu7EiB/js/2EO23myvykrEIRat9/Hx7CX3dJRm7cXAPHJUwVfFWAGS/6rQFYYdDYz\nmdlenC9SvPfZvh8D1fOTCOZhSIMsW5PERwexyrdhkdqrA0n8jDT8LNFtv6O+ju+h\naWYVa6Bw6oNmTO9UvdVHdLBBzRSvAS4p+vYcdrF7YDvKCAw7e/SldMWYn6wGWlog\n93Xhc6JXSzcMIi0sdOtwR6KEHmtPWMVB6z6XS5MCAwEAAaNTMFEwHQYDVR0OBBYE\nFDX0dJq92DP6VybzwmWQG90z0IypMB8GA1UdIwQYMBaAFDX0dJq92DP6VybzwmWQ\nG90z0IypMA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAGF6fLaP\nRWsUADcLFWOxSJmv3yglsgMXTKQkBD/j7cX9gHjNNu9KpFEp96KTdJ6v+/e2G06P\nPyq/qh3ksCLpStRNIryHFNZwckf4+ccXTxhGrsAmmJahtGhizuXLm/h1X4Uk58Tv\n8YXNNNeaQlyU6nAsZaRUfpjfEZzLOowA1kVMqweI85CuJyuZ4+kLEtG68tTC50eN\n6enuxsRDp9wmQz0fMlc41QE4L60REVk/0qz9gs98g1ZEfRHBug5f0cTcP63GPb+g\nEEWFI65xLcO0eyudkfoe7nrGfk/IiGGu/r13P0G7J+fvfah0fociFyNMPCVQGP3M\njIm/kvwNQPYVq1db7L6nXW36DJQDptU7HPjMyh6uOjtUu/z6ulVGzmzxdiMWlozg\nxgfTLAGyb4AhD7mHYOnM1w6ywoa8s80dVvkpSDo7nsZSJB+Ec2+/gU2hLY6IlUII\noEm2Qk3sxfPOrCXP3OjNEeZb2G2Db04Rvm6NPEdkPrzrZb/JwhQCvJuZ7Q==\n-----END CERTIFICATE-----\n'
          HEADERS = {"User-Agent": "Codex-math-campaign"}
          TARGETS = [
              {"handle": "con123-gif", "agent": "codex", "problem": "oeis-a329813", "kind": "formalize"},
              {"handle": "con123-gif", "agent": "codex-runtime-mo487192", "problem": "mo-487192"},
          ]

          def fetch(url, method="GET"):
              req = urllib.request.Request(url, headers=HEADERS, method=method,
                                           data=b"" if method == "POST" else None)
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      return response.status, response.read(), None
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), None
              except Exception as exc:
                  return 0, b"", type(exc).__name__

          def emit_encrypted(record, cert_path, directory):
              target = record["query"]["problem"]
              raw_path = directory / (target + ".response.json")
              encrypted_path = directory / (target + ".cms.der")
              raw_path.write_text(json.dumps(record, ensure_ascii=False))
              raw_path.chmod(0o600)
              try:
                  subprocess.run(["openssl", "cms", "-encrypt", "-binary", "-aes-256-cbc",
                                  "-outform", "DER", "-in", str(raw_path), "-out", str(encrypted_path),
                                  str(cert_path)], check=True, capture_output=True)
                  ciphertext = base64.b64encode(encrypted_path.read_bytes()).decode()
                  print("CMS_RECORD " + target + " " + ciphertext, flush=True)
                  print("SAFE_STATUS " + json.dumps({"problem": target,
                        "preflight_http": record.get("preflight_http"),
                        "claim_http": record.get("claim_http"), "phase": record.get("phase"),
                        "response_bytes": record.get("claim_response_bytes", 0)}), flush=True)
              finally:
                  raw_path.unlink(missing_ok=True)
                  encrypted_path.unlink(missing_ok=True)

          os.umask(0o077)
          with tempfile.TemporaryDirectory() as directory_name:
              directory = Path(directory_name)
              cert_path = directory / "recipient-public-certificate.pem"
              cert_path.write_text(CERTIFICATE)
              # Read current public participation rules and confirm the supported official POST alias.
              rules_http, rules, rules_error = fetch("https://lefttosolve.com/join.txt")
              time.sleep(3)
              handler_http, handler, handler_error = fetch("https://raw.githubusercontent.com/GuillaumeBAUD-coder/open-math-agents/main/app/api/desk/next/route.ts")
              supported = (rules_http == 200 and handler_http == 200 and
                           b"export const POST = handle" in handler and b"BE GENTLE WITH THE DESK" in rules)
              print("SAFE_RULES " + json.dumps({"rules_http": rules_http, "handler_http": handler_http,
                    "rules_sha256": hashlib.sha256(rules).hexdigest(),
                    "handler_sha256": hashlib.sha256(handler).hexdigest(), "supported": supported}), flush=True)
              for query in TARGETS:
                  record = {"query": query, "at": datetime.now(timezone.utc).isoformat(),
                            "phase": "not_attempted", "supported_post_alias": supported}
                  if supported:
                      time.sleep(3)
                      pre_status, pre_body, pre_error = fetch("https://lefttosolve.com/api/problems/" + query["problem"])
                      record.update(preflight_http=pre_status, preflight_body_b64=base64.b64encode(pre_body).decode(),
                                    preflight_error_type=pre_error)
                      try:
                          problem = json.loads(pre_body)
                          problem = problem.get("problem", problem)
                      except Exception:
                          problem = {}
                      eligible = (pre_status == 200 and problem.get("id") == query["problem"] and
                                  problem.get("kind") == "unformalized" and not problem.get("solution") and
                                  problem.get("liveAgents") == 0)
                      if eligible:
                          time.sleep(3)
                          claim_status, claim_body, claim_error = fetch(
                              "https://lefttosolve.com/api/desk/next?" + urllib.parse.urlencode(query), method="POST")
                          record.update(phase="single_post_attempted", claim_http=claim_status,
                                        claim_body_b64=base64.b64encode(claim_body).decode(),
                                        claim_response_bytes=len(claim_body), claim_error_type=claim_error)
                      else:
                          record["phase"] = "skipped_changed_or_unavailable_live_state"
                  else:
                      record["phase"] = "skipped_rules_or_handler_unavailable"
                  emit_encrypted(record, cert_path, directory)
          SECURE_PY
