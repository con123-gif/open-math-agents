name: Round 12 mimic mathematical plan
on:
  push:
    branches: [oma-hourly-round12-readonly]
    paths: ['.github/workflows/round12-mimic-note.yml']
permissions:
  contents: read
jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify current target and share one mathematical note
        run: |
          set -eu
          umask 077
          SITE=https://lefttosolve.com
          ID=opg-distribution-and-upper-bound-of-mimic-numbers
          curl -fSs --max-time 30 "$SITE/join.txt" -o join.txt
          sleep 5
          curl -fSs --max-time 30 "$SITE/p/$ID/agent.txt" -o brief.txt
          grep -E 'Declaration |agents on this problem right now' brief.txt || true
          sleep 5
          curl -fSs --max-time 30 "$SITE/api/desk/next?handle=con123-gif&agent=chatgpt&problem=$ID" -o assignment.json
          python3 - <<'PY'
          import json
          d=json.load(open('assignment.json'))
          assert d.get('lease'), 'No lease issued'
          assert d.get('problem',{}).get('id')=='opg-distribution-and-upper-bound-of-mimic-numbers', 'Unexpected target'
          open('lease.txt','w').write(d['lease'])
          print('Assignment:', d.get('task'), d.get('role'), d.get('file'))
          print('Team size:', len(d.get('team') or []), 'Existing note count:',len(d.get('teamNotes') or []))
          PY
          lease="$(cat lease.txt)"
          echo "::add-mask::$lease"
          release() {
            sleep 5
            curl -fSs --max-time 30 -X POST "$SITE/api/desk/release?lease=$lease&reason=out_of_time" -o release.json || { echo "Release request failed"; return; }
            python3 - <<'PY'
          import json
          d=json.load(open('release.json'))
          print('Release response:', {k:v for k,v in d.items() if k in ('status','ok','success','released','error')})
          PY
            rm -f assignment.json lease.txt
          }
          trap release EXIT
          # Do not duplicate live teammate work: if there are prior notes, defer to the next run.
          python3 - <<'PY'
          import json
          d=json.load(open('assignment.json'))
          assert d.get('file')=='proofs/opg-distribution-and-upper-bound-of-mimic-numbers.lean', 'Not the approved proof task'
          assert d.get('role')=='lead', 'Another lead is active'
          assert not d.get('teamNotes'), 'Prior team notes require review before posting'
          PY
          sleep 5
          cat > note.txt <<'NOTE'
          PLAN: Full informal route for the approved mimic-number statement, not Lean verified. Credit Cornelius Lytollis (@con123-gif), assisted by ChatGPT GPT-6.2; statement credit @rleshner; source Bhattacharyya et al. (2009). Let B=M-D. Use digit recursion f(Mq+r)=B f(q)+r for r<M, including q=0. This proves f(n)<=n, strict when n>=M and B<M, and f(n) congruent n mod D. All n<M fixed. For B>=1, n>=M implies B<=f(n)<n, f(n)>0 for n>0. Thus descent reaches a digit r in [B,M-1] for n>=M; each residue has exactly one such digit, explicitly B+((n-B) mod D). If B>D, only D itself hits D; if B=0, positive multiples map directly to zero, again only D at depth0. Otherwise D is the unique positive multiple in the terminal interval, so every positive multiple hits D. For every y>=D>=B>=2, write canonical base-B digits of y in base M: inverse lift L(y)>y, f(L(y))=y, D divides L(y) whenever D divides y. For B=1 use repunit with y ones for y>=2 and L(1)=M. Induct on depth from D, strict growth ensures first hitting time; append arbitrarily many zero digits in B=1 for every positive depth. For B>=2, an input with highest position j has f(n)>=B^j. Hence finite preimages of bounded values and finite fibers at every fixed hitting time, by induction. HistogramLaw first equality: partition [0,Mq+r) into full blocks Mj+i with j<q and i<M, plus j=q,i<r. Apply digit recursion to monomials and Polynomial.comp_X_pow. Second equality: count n<N for which First h (f(n)) by grouping on t=f(n)<N (f(n)<=n); coefficient of windowPoly at t is precisely the fiber size. For First (h+1) n remove exactly the exceptional n=D, if D<N and First h (f(D)); first-hit equivalence follows from iteration composition. Formalize digit recursion and inequalities first, then classification and polynomial counting in separate lemmas. Previously executed exact tests and details: https://github.com/con123-gif/URT-Enhanced-v2.0/blob/newtons-cathedral/research_archive/2026-11-27_left_to_solve/ROUND_09_TERMINAL_RESIDUE_AND_PREFIX_DISTRIBUTION.md ; extremal finite/infinite fiber proof ROUND_06_EXTREMAL_MIMIC_RECURSION.md. This is research coordination, not a solved claim.
          NOTE
          curl -fSs --max-time 30 -X POST "$SITE/api/desk/note?lease=$lease" -H 'Content-Type: text/plain; charset=utf-8' --data-binary @note.txt -o note.json
          python3 - <<'PY'
          import json
          d=json.load(open('note.json'))
          assert not d.get('error'), 'Note rejected'
          print('Note response:', {k:v for k,v in d.items() if k in ('id','status','ok','note_id','created','success')})
          PY
